<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Tasks</title>
<meta name="theme-color" content="#2f5d50">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f6f3ec; --card: #ffffff; --ink: #1f2a26; --muted: #66716b;
    --accent: #2f5d50; --on-accent: #ffffff; --line: #e4e0d6;
    --good: #2f7d4f; --good-soft: #e3f1e7; --bad: #b5452f; --bad-soft: #f8e4de;
    --carry: #8a5a12; --carry-soft: #fbf0d9;
    --wa: #1f8f3c; --stage: #e9e4d8; --bar: #fffbe9; --bar-line: #e7dcae;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#141a18; --card:#1e2622; --ink:#eef2ef; --muted:#9aa59f; --line:#2c3631;
    --accent:#6fb59d; --on-accent:#10201a; --good:#6cc28f; --good-soft:#1c3326; --bad:#ec8a72; --bad-soft:#3a221c;
    --carry:#e5b55f; --carry-soft:#33291a; --wa:#25a244; --stage:#0d1210; --bar:#23261c; --bar-line:#3a3d2a; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg:#141a18; --card:#1e2622; --ink:#eef2ef; --muted:#9aa59f; --line:#2c3631;
    --accent:#6fb59d; --on-accent:#10201a; --good:#6cc28f; --good-soft:#1c3326; --bad:#ec8a72; --bad-soft:#3a221c;
    --carry:#e5b55f; --carry-soft:#33291a; --wa:#25a244; --stage:#0d1210; --bar:#23261c; --bar-line:#3a3d2a; color-scheme: dark }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .phone { max-width: 480px; margin: 0 auto; background: var(--bg); min-height: 100vh; }
  header { padding: 20px 16px 8px; }
  h1 { margin: 0; font-size: 26px; text-wrap: balance; }
  .date { color: var(--muted); margin-top: 2px; }
  .who { display: flex; gap: 8px; padding: 12px 16px; }
  .who button { flex: 1; min-width: 0; padding: 12px 6px; font-family: inherit; font-weight: 600; font-size: 16px; line-height: 1.2; border-radius: 14px;
    border: 2px solid var(--accent); background: var(--card); color: var(--accent); cursor: pointer; }
  .who button.on { background: var(--accent); color: var(--on-accent); }
  .progress { margin: 4px 16px 4px; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; display: flex; }
  .bar .g { background: var(--good); } .bar .b { background: var(--bad); }
  .bar > div { transition: width .3s; }
  .count { color: var(--muted); font-size: 15px; margin-top: 6px; font-variant-numeric: tabular-nums; display: flex; gap: 12px; flex-wrap: wrap; }
  .count b { font-weight: 600; } .count .cg { color: var(--good); } .count .cb { color: var(--bad); }
  ul { list-style: none; margin: 0; padding: 0 16px; }
  h2.sec { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 4px 8px; }
  h2.sec.carry { color: var(--carry); }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-bottom: 10px;
    display: grid; gap: 10px; }
  li.is-done { border-color: var(--good); background: var(--good-soft); }
  li.is-not { border-color: var(--bad); background: var(--bad-soft); }
  li.carried { border-left: 5px solid var(--carry); }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--carry); background: var(--carry-soft);
    border-radius: 99px; padding: 2px 8px; margin-bottom: 4px; }
  .choice { display: flex; gap: 8px; }
  .choice label { flex: 1; position: relative; cursor: pointer; }
  .choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .choice span { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 6px; border-radius: 10px;
    border: 2px solid var(--line); font-weight: 600; font-size: 16px; color: var(--muted); background: var(--card); }
  .choice span::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; flex: none; }
  .choice .yes input:checked + span { border-color: var(--good); color: var(--good); }
  .choice .no input:checked + span { border-color: var(--bad); color: var(--bad); }
  .choice input:checked + span::before { background: currentColor; box-shadow: inset 0 0 0 3px var(--card); }
  .choice input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .notes { padding: 6px 16px 16px; }
  .notes label { font-weight: 600; display: block; margin-bottom: 6px; }
  textarea { width: 100%; min-height: 80px; border-radius: 14px; border: 1px solid var(--line);
    padding: 12px; font: inherit; background: var(--card); color: var(--ink); }
  .sendwrap { position: sticky; bottom: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(transparent, var(--bg) 30%); }
  .send { width: 100%; padding: 17px; font-family: inherit; font-weight: 700; font-size: 18px; border: 0; border-radius: 16px;
    background: var(--wa); color: #fff; cursor: pointer; }
  .send:focus-visible, .who button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>
<body>
<div class="phone">
  <header>
    <h1 id="title">Home Tasks</h1>
    <div class="date" id="date"></div>
  </header>
  <div class="who" id="who"></div>
  <div class="progress">
    <div class="bar"><div class="g" id="fillG"></div><div class="b" id="fillB"></div></div>
    <div class="count" id="count"></div>
  </div>
  <ul id="list"></ul>
  <div class="notes">
    <label for="note">Notes / problems (optional)</label>
    <textarea id="note" placeholder="e.g. Out of dishwashing liquid, hose is leaking…"></textarea>
  </div>
  <div class="sendwrap"><button class="send" id="send" type="button">Send report on WhatsApp</button></div>
</div>
<script>
function start() {
  const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  let now = new Date();
  const CARRY = "Carried over from last visit";
  
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  document.getElementById("title").textContent = CONFIG.HOUSEHOLD_NAME;
  const param = new URLSearchParams(location.search).get("who");
  let personId = param || store.get("person", PEOPLE[0].id);
  if (!PEOPLE.some(p => p.id === personId)) personId = PEOPLE[0].id;

  const whoEl = document.getElementById("who");
  PEOPLE.forEach(p => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = p.name; b.dataset.id = p.id;
    b.onclick = () => { personId = p.id; store.set("person", p.id); render(); };
    whoEl.appendChild(b);
  });

  const person = () => PEOPLE.find(p => p.id === personId);
  const today = () => keyOf(now);
  // log[person] = { "YYYY-MM-DD": { tasks: [text...], s: { text: "done" | "not" }, note } }
  const logKey = () => "log:" + personId;
  const getLog = () => store.get(logKey(), {});
  const saveLog = l => store.set(logKey(), l);

  const showsToday = t => {
    const wk = Math.min(4, Math.ceil(now.getDate() / 7)), month = now.getMonth() + 1;
    if (t.date) return t.date === today();
    if (Array.isArray(t.days) && !t.days.includes(DAYS[now.getDay()])) return false;
    if (t.week && !t.week.includes(wk)) return false;
    if (t.months && !t.months.includes(month)) return false;
    return true;
  };

  // Last visit before today on which anything was marked
  function lastVisit(log) {
    const d = Object.keys(log).filter(k => k < today() && log[k].s && Object.keys(log[k].s).length).sort().pop();
    return d ? log[d] : null;
  }

  // Today's list: carried-over first, then today's tasks in written order
  function todaysTasks() {
    const log = getLog();
    const prev = lastVisit(log);
    const missed = prev ? prev.tasks.filter(t => prev.s[t] !== "done") : [];
    const regular = person().tasks.filter(showsToday);
    const ordered = [...regular.filter(t => t.date), ...regular.filter(t => !t.date)].map(t => ({ ...t }));
    const regularTexts = new Set(ordered.map(t => t.text));
    ordered.forEach(t => { if (missed.includes(t.text)) t.missedLast = true; });
    const carried = missed.filter(x => !regularTexts.has(x)).map(text => ({ text, section: CARRY, carried: true }));
    return [...carried, ...ordered];
  }

  function entry(log) {
    return log[today()] ||= { tasks: [], s: {}, note: "" };
  }

  const dateLabel = () => now.toLocaleDateString("en-ZA", { weekday: "long", day: "numeric", month: "long" });

  function render() {
    document.getElementById("date").textContent = dateLabel();
    [...whoEl.children].forEach(b => b.classList.toggle("on", b.dataset.id === personId));
    const tasks = todaysTasks();
    const log = getLog();
    const s = (log[today()] || {}).s || {};
    const list = document.getElementById("list");
    list.innerHTML = "";
    let lastSec;
    tasks.forEach((t, i) => {
      if (t.section && t.section !== lastSec) {
        lastSec = t.section;
        const h = document.createElement("h2");
        h.className = "sec" + (t.carried ? " carry" : ""); h.textContent = t.section;
        list.appendChild(h);
      }
      const st = s[t.text];
      const li = document.createElement("li");
      li.className = (st === "done" ? "is-done" : st === "not" ? "is-not" : "") + (t.carried || t.missedLast ? " carried" : "");
      const name = "t" + i;
      li.innerHTML = `<div>${t.carried || t.missedLast ? '<span class="tag">Not finished last visit</span><br>' : ""}<span class="t"></span></div>
        <div class="choice" role="radiogroup">
          <label class="yes"><input type="radio" name="${name}" value="done" ${st === "done" ? "checked" : ""}><span>Done</span></label>
          <label class="no"><input type="radio" name="${name}" value="not" ${st === "not" ? "checked" : ""}><span>Not done</span></label>
        </div>`;
      li.querySelector(".t").textContent = t.text;
      li.querySelectorAll("input").forEach(inp => inp.onchange = () => {
        const l = getLog(), e = entry(l);
        e.tasks = tasks.map(x => x.text);
        e.s[t.text] = inp.value;
        saveLog(l); render();
      });
      list.appendChild(li);
    });
    const nd = tasks.filter(t => s[t.text] === "done").length;
    const nn = tasks.filter(t => s[t.text] === "not").length;
    const left = tasks.length - nd - nn;
    document.getElementById("fillG").style.width = tasks.length ? (nd / tasks.length * 100) + "%" : "0";
    document.getElementById("fillB").style.width = tasks.length ? (nn / tasks.length * 100) + "%" : "0";
    document.getElementById("count").innerHTML =
      `<span class="cg"><b>${nd}</b> done</span><span class="cb"><b>${nn}</b> not done</span><span><b>${left}</b> still to mark</span>`;
    document.getElementById("note").value = (log[today()] || {}).note || "";
    
  }

  document.getElementById("note").oninput = e => {
    const l = getLog(), en = entry(l);
    en.tasks = todaysTasks().map(x => x.text);
    en.note = e.target.value; saveLog(l);
  };

  function reportText() {
    const tasks = todaysTasks();
    const s = (getLog()[today()] || {}).s || {};
    const done = tasks.filter(t => s[t.text] === "done");
    const not = tasks.filter(t => s[t.text] === "not");
    const unmarked = tasks.filter(t => !s[t.text]);
    const note = ((getLog()[today()] || {}).note || "").trim();
    const block = (title, arr, mark) => arr.length ? [`*${title} (${arr.length}):*`, ...arr.map(t => mark + " " + t.text + (t.carried || t.missedLast ? " (carried over)" : "")), ""] : [];
    return [
      `*${person().name} – ${dateLabel()}*`,
      `${done.length}/${tasks.length} done`, "",
      ...block("Not done", not, "❌"),
      ...block("Not marked", unmarked, "⚪"),
      ...block("Done", done, "✅"),
      ...(note ? [`📝 ${note}`] : []),
    ].join("\n").trim();
  }
  
  document.getElementById("send").onclick = () => {
    location.href = `https://wa.me/${CONFIG.OWNER_WHATSAPP}?text=${encodeURIComponent(reportText())}`;
  };
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

  window.staffRender = render;
}

let CONFIG, PEOPLE;
fetch("tasks.json", { cache: "no-store" })
  .then(r => r.json())
  .then(d => { CONFIG = d.config; PEOPLE = d.people; start(); })
  .catch(() => {
    document.getElementById("list").innerHTML = '<p style="padding:16px">The task list didn\'t load. Check the internet connection and open the app again.</p>';
  });
</script>
</body>
</html>
